<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Register</title>
<link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon"></div>
    <h1>TaskFlow</h1>
    <p>Create your account</p>
  </div>
  <div id="msg" class="msg hidden"></div>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username"/>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Choose a password"/>
  </div>
  <button class="btn btn-primary full-width" onclick="doRegister()">Create Account</button>
  <p class="auth-switch">Have an account? <a href="/login">Login here</a></p>
</div>
<script>
async function doRegister() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  if (!username || !password) { showMsg('Both fields required', 'error'); return; }
  const res = await fetch('/auth/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (res.ok) { showMsg('Account created! Redirecting...', 'success'); setTimeout(() => window.location.href = '/login', 1200); }
  else { showMsg(data.error, 'error'); }
}
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
</script>
</body>
</html>
