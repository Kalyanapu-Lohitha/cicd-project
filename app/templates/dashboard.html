<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">
    <div class="logo-icon small"></div>
    <span>TaskFlow</span>
  </div>
  <div class="nav-right">
    <span class="nav-user">{{ user.username }}</span>
    <button class="btn btn-ghost" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="container">
  <!-- Stats row -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card" id="stat-total"><div class="stat-num">-</div><div class="stat-label">Total tasks</div></div>
    <div class="stat-card pending"  id="stat-pending"><div class="stat-num">-</div><div class="stat-label">Pending</div></div>
    <div class="stat-card progress" id="stat-progress"><div class="stat-num">-</div><div class="stat-label">In progress</div></div>
    <div class="stat-card done"     id="stat-done"><div class="stat-num">-</div><div class="stat-label">Done</div></div>
  </div>

  <!-- Add task form -->
  <div class="card">
    <h2>Add new task</h2>
    <div class="form-row">
      <div class="form-group flex-2">
        <label>Title *</label>
        <input type="text" id="new-title" placeholder="What needs to be done?"/>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="new-priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="new-category"></select>
      </div>
      <div class="form-group">
        <label>Due date</label>
        <input type="date" id="new-due"/>
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="new-desc" placeholder="Optional description"/>
    </div>
    <button class="btn btn-primary" onclick="createTask()">Add task</button>
    <div id="form-msg" class="msg hidden"></div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-filter="">All</button>
    <button class="filter-btn" data-filter="priority=high">High priority</button>
    <button class="filter-btn" data-filter="priority=medium">Medium</button>
    <button class="filter-btn" data-filter="priority=low">Low</button>
    <button class="filter-btn" data-filter="status=pending">Pending</button>
    <button class="filter-btn" data-filter="status=in_progress">In progress</button>
    <button class="filter-btn" data-filter="status=done">Done</button>
  </div>

  <!-- Task list -->
  <div id="task-list" class="task-list"></div>
</div>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
