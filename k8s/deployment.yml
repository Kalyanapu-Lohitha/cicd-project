apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-deployment
  namespace: taskflow
  labels:
    app: taskflow
    version: "IMAGE_TAG"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: taskflow
        version: "IMAGE_TAG"
    spec:
      containers:
      - name: taskflow
        image: lohitha30285/cicd-project:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 15