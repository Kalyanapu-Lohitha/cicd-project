name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Run Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run all 15 test cases with verbose output
        run: pytest tests/ -v --tb=short --no-header -rN

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-project:latest .

      - name: Smoke test — health endpoint
        run: |
          docker run -d --name app -p 5000:5000 cicd-project:latest
          sleep 6
          curl --fail http://localhost:5000/health
          docker stop app

  code-quality:
    name: Code Quality Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run pytest with coverage report
        run: |
          pip install pytest-cov
          pytest tests/ --cov=app --cov-report=term-missing -v

      - name: Check code style with flake8
        run: |
          pip install flake8
          flake8 app/ --max-line-length=120 --exclude=__pycache__ || true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Deploy to staging
        run: echo "Deploying to STAGING — commit ${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: echo "Deploying to PRODUCTION — commit ${{ github.sha }}"